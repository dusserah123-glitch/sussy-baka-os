services:
  sussy-account:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      FORWARDED_ALLOW_IPS: "127.0.0.1"
      SUSSY_ACCOUNT_SECRET: ${SUSSY_ACCOUNT_SECRET:?set a random 32+ character secret}
      SUSSY_ACCOUNT_DB: /var/lib/sussy-account/accounts.sqlite3
      SUSSY_ACCOUNT_DEV_MODE: "false"
      SMTP_HOST: ${SMTP_HOST:?configure SMTP}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:?configure SMTP sender}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SSL: ${SMTP_SSL:-false}
    volumes:
      - sussy-account-data:/var/lib/sussy-account
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  sussy-account-data:
