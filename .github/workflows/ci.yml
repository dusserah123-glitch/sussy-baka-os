name: Sussy Account container validation
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  account-container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python syntax
        run: python -m py_compile services/sussy-account/app.py services/sussy-account/entrypoint.py
      - name: Build account API container
        run: docker build -t sussy-account-api -f services/sussy-account/Dockerfile services/sussy-account
